<div class="ren-json-report-settings-editor">
    <textarea class="ren-json-report-settings-editor__textarea js-ren-json-report-settings-editor-textarea"
        spellcheck="false" wrap="off"></textarea>
    <div class="ren-json-report-settings-editor__footer">
        <button type="button"
            class="ren-json-report-settings-editor__button js-ren-json-report-settings-editor-copy"

            class="ren-json-report-settings-editor__button js-ren-json-report-settings-editor-close">Close</button>
    </div>
