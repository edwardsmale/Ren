<div class="ren-find-window__content">
    <input type="text"
           class="ren-find-window__input js-ren-find-window-input qa-ren-find-window-input"
           autocomplete="off" />
    <div class="ren-find-window__columns js-ren-find-window-columns qa-ren-find-window-columns">
        <span class="ren-find-window__columns-text js-ren-find-window-columns-text qa-ren-find-window-columns-text"></span>
        <button type="button"
                class="ren-find-window__columns-clear-button ren-link-button js-ren-find-window-columns-clear-button qa-ren-find-window-columns-clear-button"
                title="Search every column">
            &times;
        </button>
    </div>
    <label class="ren-find-window__option">
        <input type="checkbox"
               class="ren-find-window__option-checkbox js-ren-find-window-match-case qa-ren-find-window-match-case" />
        Match <span class="ren-find-window__access-key">c</span>ase
    </label>
    <label class="ren-find-window__option">
        <input type="checkbox"
               class="ren-find-window__option-checkbox js-ren-find-window-match-whole-cell qa-ren-find-window-match-whole-cell" />
        Match <span class="ren-find-window__access-key">e</span>ntire cell contents
    </label>
    <div class="ren-find-window__buttons">
        <button class="ren-find-window__button js-ren-find-window-find-next-button qa-ren-find-window-find-next-button">
            <span class="ren-find-window__button-label ren-find-window__button-label--find-next">Find Next</span>
            <span class="ren-find-window__button-label ren-find-window__button-label--find-first">Find First</span>
        </button>
        <button type="button"
                class="ren-find-window__start-from-top-button ren-link-button js-ren-find-window-start-from-top-button qa-ren-find-window-start-from-top-button"
                title="Search from the top of the grid rather than on from the cell last found">
            start from top
        </button>
    </div>
    <div class="ren-find-window__buttons">
        <button class="ren-find-window__button js-ren-find-window-select-rows-button qa-ren-find-window-select-rows-button"
                title="Select every row with a matching cell">
            Select Rows
        </button>
        <button class="ren-find-window__button js-ren-find-window-copy-rows-button qa-ren-find-window-copy-rows-button"
                title="Select every row with a matching cell and copy them to the clipboard">
            Copy Rows
        </button>
    </div>
    <div class="ren-find-window__buttons">
        <button class="ren-find-window__button js-ren-find-window-filter-rows-button qa-ren-find-window-filter-rows-button"
                title="Filter the grid down to the rows with a matching cell">
            Filter Rows
        </button>
        <button type="button"
                class="ren-find-window__filter-rows-clear-button ren-link-button js-ren-find-window-filter-rows-clear-button qa-ren-find-window-filter-rows-clear-button"
                title="Clear the Filter Rows filter">
            clear filter
        </button>
    </div>
    <div class="ren-find-window__status js-ren-find-window-status qa-ren-find-window-status"></div>
</div>
