<div class="ren-calendar qa-ren-calendar">
    <div class="ren-calendar__content">
        <div class="ren-calendar__toolbar">
            <button type="button"
                    class="ren-calendar__navigate-button js-ren-calendar-previous-button qa-ren-calendar-previous-button"
                    title="Show earlier months">
                &#10094;
            </button>
            <button type="button"
                    class="ren-calendar__today-button ren-link-button js-ren-calendar-today-button qa-ren-calendar-today-button"
                    title="Show the current month">
                Today
            </button>
            <button type="button"
                    class="ren-calendar__navigate-button js-ren-calendar-next-button qa-ren-calendar-next-button"
                    title="Show later months">
                &#10095;
            </button>
            <span class="ren-calendar__status js-ren-calendar-status qa-ren-calendar-status"></span>
        </div>
        <div class="ren-calendar__months js-ren-calendar-months qa-ren-calendar-months"></div>
    </div>
</div>
