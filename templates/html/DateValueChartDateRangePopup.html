<div class="ren-date-range-popup__content">
    <label class="ren-date-range-popup__row">
        <span class="ren-date-range-popup__label">From</span>
        <input type="date"
               class="ren-date-range-popup__input js-ren-date-range-popup-from qa-ren-date-range-popup-from"
               min="@parameters.min"
               max="@parameters.max" />
    </label>
    <label class="ren-date-range-popup__row">
        <span class="ren-date-range-popup__label">To</span>
        <input type="date"
               class="ren-date-range-popup__input js-ren-date-range-popup-to qa-ren-date-range-popup-to"
               min="@parameters.min"
               max="@parameters.max" />
    </label>
    <div class="ren-date-range-popup__buttons">
        <button class="js-ren-date-range-popup-clear qa-ren-date-range-popup-clear">Reset</button>
    </div>
</div>
