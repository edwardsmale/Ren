               class="ren-range-slider js-ren-colour-scheme-popup-slider qa-ren-colour-scheme-slider"
               min="0"
               max="@parameters.max"
               step="1" />

    <div class="ren-date-value-chart-colour-scheme-popup__name js-ren-colour-scheme-popup-name"></div>
    <div class="ren-date-value-chart-colour-scheme-popup__swatches js-ren-colour-scheme-popup-swatches"></div>
