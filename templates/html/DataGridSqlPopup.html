<div class="ren-data-grid-sql-popup qa-ren-data-grid-sql-popup">

    <textarea class="ren-data-grid-sql-popup__sql js-ren-data-grid-sql-popup-sql qa-ren-data-grid-sql-popup-sql"
              spellcheck="false"></textarea>

    <div class="ren-data-grid-sql-popup__buttons">

        <button type="button"
                class="ren-data-grid-sql-popup__left-button js-ren-data-grid-sql-popup-extra qa-ren-data-grid-sql-popup-extra"></button>

        <button type="button"
                class="js-ren-data-grid-sql-popup-copy qa-ren-data-grid-sql-popup-copy"
                title="Copy all of the SQL to the clipboard">
            Copy all
        </button>

        <button type="button"
                class="js-ren-data-grid-sql-popup-close qa-ren-data-grid-sql-popup-close">
            Close
        </button>
    </div>
</div>
