<div class="ren-function-save-popup__content">
    <label class="ren-function-save-popup__label">
        Name
        <input type="text"
               class="ren-function-save-popup__input js-ren-function-save-popup-name qa-ren-function-save-popup-name"
               autocomplete="off"
               spellcheck="false" />
    </label>
    <div class="ren-function-save-popup__hint">Saved as lower-case words joined by hyphens, e.g. margin-percent.</div>
    <label class="ren-function-save-popup__label">
        Description
        <input type="text"
               class="ren-function-save-popup__input js-ren-function-save-popup-description qa-ren-function-save-popup-description"
               autocomplete="off" />
    </label>
    <div class="ren-function-save-popup__tags"
         title="The kinds of function this is, which decide the menus it is listed on.  A function tagged html is offered only where a function may return HTML.">
        <span class="ren-function-save-popup__tags-caption">Tags:</span>
        <label><input type="checkbox" class="js-ren-function-save-popup-tag" value="format" /> format</label>
        <label><input type="checkbox" class="js-ren-function-save-popup-tag" value="calculation" /> calculation</label>
        <label><input type="checkbox" class="js-ren-function-save-popup-tag" value="binning" /> binning</label>
        <label><input type="checkbox" class="js-ren-function-save-popup-tag" value="sort" /> sort</label>
        <label><input type="checkbox" class="js-ren-function-save-popup-tag" value="html" /> html</label>
    </div>
    <div class="ren-function-save-popup__buttons">
        <button class="js-ren-function-save-popup-save qa-ren-function-save-popup-save">Save</button>
        <button class="js-ren-function-save-popup-cancel">Cancel</button>
    </div>
</div>
