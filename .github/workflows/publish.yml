# Builds and tests the release a pushed v* tag marks, then packs it and pushes it to nuget.org, signing in with Trusted
# Publishing, so there's no stored API key.  The pack refuses a tag whose VERSION doesn't match
# it, or that doesn't build as a release.  nuget.org needs a Trusted Publishing policy for this
# repo and this workflow file, and the repo needs a NUGET_USER secret holding the nuget.org
# profile name.
name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # lets gh create the GitHub release
  id-token: write   # lets the job get the token nuget.org exchanges for a temporary key

jobs:
  publish:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the pack checks the tag exists and builds it in a worktree

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # The same build and tests as CI, run here too, since CI is a separate workflow that this one
      # doesn't wait for, so a release whose tests fail isn't published.  The client tests run
      # only on the minified build, since that's what hosts serve.
      - name: Install Chromium
        run: |
          dotnet build test/Ren.Client.Tests
          pwsh test/Ren.Client.Tests/bin/Debug/net8.0/playwright.ps1 install chromium

      - name: Build and test
        run: dotnet run --project build/Ren.Build -- ci --minified

      # A trace of each browser test that failed, to open in Playwright's trace viewer.
      - name: Keep the failed tests' traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-traces
          path: TestResults/traces/
          if-no-files-found: ignore

      - name: Pack
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          dotnet run --project build/Ren.Build -- pack $version

      # After the pack, so the temporary key (about an hour) is fresh when the push uses it.
      - name: Sign in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          dotnet nuget push "packages/Ren.$version.nupkg" `
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate

      # Copies the release's built files into release-files/, from a checked build of the tag.
      - name: Collect the client files
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          dotnet run --project build/Ren.Build -- export $version (Join-Path $env:GITHUB_WORKSPACE release-files)

      # Creates the GitHub release for the tag, with the client files and the package as downloads.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          gh release create $env:GITHUB_REF_NAME `
            (Get-ChildItem release-files).FullName `
            "packages/Ren.$version.nupkg" `
            --title "Ren $version" `
            --generate-notes