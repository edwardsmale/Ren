# Packs the release a pushed v* tag marks and pushes it to nuget.org, signing in with Trusted
# Publishing, so there's no stored API key.  The pack refuses a tag whose VERSION doesn't match
# it, or that doesn't build as a release.  nuget.org needs a Trusted Publishing policy for this
# repo and this workflow file, and the repo needs a NUGET_USER secret holding the nuget.org
# profile name.
name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write   # lets the job get the token nuget.org exchanges for a temporary key

jobs:
  publish:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the pack checks the tag exists and builds it in a worktree

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Pack
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          dotnet run --project build/Ren.Build -- pack $version

      # After the pack, so the temporary key (about an hour) is fresh when the push uses it.
      - name: Sign in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          dotnet nuget push "packages/Ren.$version.nupkg" `
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate
