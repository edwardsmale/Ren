<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Change chart in a tab - Ren test fixture</title>
    <link href="/dist/ren.css" rel="stylesheet" />
    <script src="/examples/lib/write-excel-file.v1.4.27.min.js"></script>
    <script src="/dist/ren.js"></script>
</head>
<body>
    <ren-tabbed-module>
        <ren-tabbed-module-tab>
            <ren-tabbed-module-tab-header>
                <h2>First</h2>
            </ren-tabbed-module-tab-header>
            <ren-tabbed-module-content>
                <!-- Empty tab -->
            </ren-tabbed-module-content>
        </ren-tabbed-module-tab>
        <ren-tabbed-module-tab>
            <ren-tabbed-module-tab-header>
                <h2>Changes</h2>
            </ren-tabbed-module-tab-header>
            <ren-tabbed-module-content>
                <div class="hidden-at-first" style="width: 40rem">
                    <ren-change-chart
                        src="/test/browser/fixtures/change-chart/change-chart.json" />
                </div>
            </ren-tabbed-module-content>
        </ren-tabbed-module-tab>
    </ren-tabbed-module>
</body>
</html>
