<!doctype html>
<!-- A page whose content security policy allows no eval and no inline script.  Ren's parse
     workers are scripts made from blobs, so they're allowed by worker-src. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
    <title>Strict CSP - Ren test fixture</title>
    <link href="/dist/ren.css" rel="stylesheet" />
    <script src="/examples/lib/write-excel-file.v1.4.27.min.js"></script>
    <script src="/dist/ren.js"></script>
</head>
<body>
    <ren-grid src="/examples/data/sales.renpack"
              data-format="renpack"
              show-row-and-column-headings />
</body>
</html>
